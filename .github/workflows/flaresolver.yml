name: Test FlareSolverr

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Wait for FlareSolverr
        run: |
          until curl -sf http://localhost:8191/; do
            sleep 2
          done

      - name: Fetch /feed
        run: |
          curl -s \
            -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{
              "cmd":"request.get",
              "url":"https://ziperto.com/feed/",
              "headers": {
                "Accept": "application/rss+xml, application/xml;q=0.9, text/xml;q=0.8, */*;q=0.1"
              },
              "maxTimeout":120000
            }' \
          | jq -e -r '.solution.response' > feed.xml

      - name: Upload feed
        uses: actions/upload-artifact@v7
        with:
          name: feed
          path: feed.xml
