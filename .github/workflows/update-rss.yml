name: Update RSS

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Generate RSS feeds
        run: |
          mkdir -p docs
          go run ./cmd/lobster > docs/lobsters.xml
          go run ./cmd/hn > docs/hn.xml

      - name: Fetch Ziperto feed
        run: |
          docker run -d --name flaresolverr -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest

          for i in {1..30}; do
              if curl -sf http://localhost:8191/ >/dev/null; then
                  break
              fi
              sleep 2
          done

          curl -sf http://localhost:8191/ >/dev/null || {
              echo "FlareSolverr failed to start"
              exit 1
          }

          curl -s \
            -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{
              "cmd":"request.get",
              "url":"https://ziperto.com/feed/",
              "maxTimeout":120000
            }' > response.json

          go run ./cmd/unescape response.json
          mv feed.xml docs/ziperto.xml

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update feed
